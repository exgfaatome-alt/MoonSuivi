name: Construire l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: 1.${{ github.run_number }}
      HAS_KEY: ${{ secrets.MOONSUIVI_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5

      - name: Clé de signature
        env:
          KEYSTORE: ${{ secrets.MOONSUIVI_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > app/moonsuivi.jks
            echo "Clé de signature installée"
          else
            echo "::warning::Secret MOONSUIVI_KEYSTORE absent : APK signé avec une clé temporaire, pas de publication."
          fi

      - name: Compiler
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PversionCode=${{ github.run_number }} -PversionName=$VERSION

      - name: Préparer la publication
        env:
          NOTES: ${{ github.event.head_commit.message }}
          REPO: ${{ github.repository }}
          CODE: ${{ github.run_number }}
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/MoonSuivi.apk
          python3 - <<'EOF'
          import json, os
          v = os.environ["VERSION"]
          info = {
              "versionCode": int(os.environ["CODE"]),
              "versionName": v,
              "apk": f"https://github.com/{os.environ['REPO']}/releases/download/v{v}/MoonSuivi.apk",
              "notes": os.environ.get("NOTES") or "",
          }
          json.dump(info, open("out/version.json", "w"), ensure_ascii=False)
          EOF
          cat out/version.json

      - uses: actions/upload-artifact@v6
        with:
          name: MoonSuivi-apk
          path: out/MoonSuivi.apk

      - name: Publier la mise à jour
        if: env.HAS_KEY == 'true' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          gh release create "v$VERSION" out/MoonSuivi.apk out/version.json \
            --title "MoonSuivi $VERSION" --notes "${NOTES:-Mise à jour}" --latest
